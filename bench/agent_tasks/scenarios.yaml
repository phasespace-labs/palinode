# Agent-task corpus — authored (dev) split.
#
# Each scenario is a tiny synthetic Python repo (stdlib + unittest only), one
# prompt, the memory events, and an oracle stated over TOKEN NAMES. Values are
# stamped per cell from a seeded RNG by `plan`, so nothing here is an answer an
# agent could have memorized, and every cell's tokens are distinct.
#
# Templates use string.Template: ${name} is a token value, ${opt_N} the N-th
# entry of `options` in a seeded order, ${project} the cell's project name.
# A literal dollar sign is $$.
#
# Dates are relative: ${dN} is the plan's `as_of` date minus N days
# (`plan --as-of`, default today UTC). No absolute date may appear, and no
# fixture is older than 30 days: the store's status-log retention retires
# dated lines by age before a model sees them, and a fixed calendar date
# drifts out of the window as runs move away from it (rig run, 2026-09-26).
# Order and spacing are kept: fillers d27–d21, decision A d20, later notes
# d19–d15, the correction / B d7, prior sessions d6, restore d3, session
# notes d0.
#
# Prompts are what a user would type. They never name the memory mechanism,
# and they are identical across arms and clients.
#
# The held-out split is DERIVED (corpus.derive_held_out), never authored here.
#
# How the file and native arms express each op (the careful user's notes):
#   save → a dated line · correct → a later "(changed)" line, the old one kept
#   archive → a "retired; no longer applies" line · restore → "restored" line
#   consolidate / restart / reindex → nothing (infrastructure, not an event)
#   session_end, and a status document marked silent_in_log → nothing: they
#     restate an event the log already has a line for
#   transcript_capture / agent_session → the event's authored `log:` line,
#     i.e. what the user would have jotted down after that conversation. The
#     file arm cannot "capture"; it gets the note a person would have written,
#     which is the comparison the study wants (row 4, rows 5–6).
#   a save under another project (row 15) → a line labelled with that project,
#     the closest a notes file comes to a store shared across projects.
corpus_version: 3

repos:

  # Row 18 — implement a new module; the prefix exists only in the user's rule.
  module_rule:
    .gitignore: |
      __pycache__/
    README.md: |
      # ${project}

      Small label-normalization library. Add a new module under `labels/`,
      implement `normalize(text)` there, and re-export it from `labels/__init__.py`.
      Strip leading/trailing whitespace, lowercase, and join whitespace-separated
      words with a single hyphen. Run `python3 -m unittest -q`.
    labels/__init__.py: |
      def normalize(text):
          raise NotImplementedError("Implement normalization in a new module")
    tests/__init__.py: ""
    tests/test_labels.py: |
      import unittest
      from labels import normalize

      class LabelsTest(unittest.TestCase):
          def test_normalize(self):
              self.assertEqual(normalize("  Hello   WORLD  "), "hello-world")
              self.assertEqual(normalize(""), "")
              self.assertEqual(normalize("one\ttwo\nthree"), "one-two-three")

  # Row 1 — two interchangeable cache backends; the pipeline has none yet.
  ingest_cache:
    .gitignore: |
      __pycache__/
    README.md: |
      # ${project}

      Record ingest service. `ingest.pipeline.Pipeline` loads records through a
      loader callable and normalizes their keys.

      Cache backends live in `ingest/backends/`; each exposes a `Cache` class
      with `get(key)` and `set(key, value)`, registered by name in
      `ingest.backends.REGISTRY`.

      Run the tests with `python3 -m unittest -q`.
    ingest/__init__.py: ""
    ingest/backends/__init__.py: |
      """Cache backends, registered by name."""
      from ingest.backends import ${opt_1}, ${opt_2}

      REGISTRY = {
          "${opt_1}": ${opt_1}.Cache,
          "${opt_2}": ${opt_2}.Cache,
      }
    ingest/backends/${opt_1}.py: |
      """In-process cache bounded by entry count (least recently used goes first)."""
      from collections import OrderedDict


      class Cache:
          def __init__(self, capacity=1024):
              self.capacity = capacity
              self._data = OrderedDict()

          def get(self, key):
              if key not in self._data:
                  return None
              self._data.move_to_end(key)
              return self._data[key]

          def set(self, key, value):
              self._data[key] = value
              self._data.move_to_end(key)
              while len(self._data) > self.capacity:
                  self._data.popitem(last=False)
    ingest/backends/${opt_2}.py: |
      """In-process cache whose entries expire after a fixed number of seconds."""
      import time


      class Cache:
          def __init__(self, ttl_s=300.0, clock=time.monotonic):
              self.ttl_s = ttl_s
              self._clock = clock
              self._data = {}

          def get(self, key):
              entry = self._data.get(key)
              if entry is None:
                  return None
              value, stored_at = entry
              if self._clock() - stored_at > self.ttl_s:
                  del self._data[key]
                  return None
              return value

          def set(self, key, value):
              self._data[key] = (value, self._clock())
    ingest/pipeline.py: |
      """Record ingest pipeline."""


      def normalize(record):
          return {key.strip().lower(): value for key, value in record.items()}


      class Pipeline:
          def __init__(self, loader):
              self.loader = loader

          def fetch(self, key):
              return normalize(self.loader(key))
    tests/__init__.py: ""
    tests/test_pipeline.py: |
      import unittest

      from ingest import backends
      from ingest.pipeline import Pipeline, normalize


      class NormalizeTest(unittest.TestCase):
          def test_keys_are_trimmed_and_lowercased(self):
              self.assertEqual(normalize({" Name ": 1}), {"name": 1})


      class PipelineCacheTest(unittest.TestCase):
          def test_repeat_fetch_is_served_from_cache(self):
              calls = []

              def loader(key):
                  calls.append(key)
                  return {" Name ": key}

              pipeline = Pipeline(loader)
              self.assertEqual(pipeline.fetch("a"), {"name": "a"})
              self.assertEqual(pipeline.fetch("a"), {"name": "a"})
              self.assertEqual(calls, ["a"])

          def test_cache_is_a_registered_backend(self):
              pipeline = Pipeline(lambda key: {})
              self.assertIsInstance(pipeline.cache, tuple(backends.REGISTRY.values()))


      if __name__ == "__main__":
          unittest.main()

  # Row 2 — two interchangeable delivery transports; the dispatcher has none.
  notify_transport: &notify_files
    .gitignore: |
      __pycache__/
    README.md: |
      # ${project}

      Outbound notification service. `notify.dispatch.Dispatcher` formats a
      message and hands it to a delivery transport.

      Transports live in `notify/transports/`; each exposes a `Transport` class
      with `send(recipient, body)` returning a receipt string, registered by name
      in `notify.transports.REGISTRY`.

      Run the tests with `python3 -m unittest -q`.
    notify/__init__.py: ""
    notify/transports/__init__.py: |
      """Delivery transports, registered by name."""
      from notify.transports import ${opt_1}, ${opt_2}

      REGISTRY = {
          "${opt_1}": ${opt_1}.Transport,
          "${opt_2}": ${opt_2}.Transport,
      }
    notify/transports/${opt_1}.py: |
      """Delivers each message immediately, one call per message."""


      class Transport:
          def __init__(self):
              self.sent = []

          def send(self, recipient, body):
              self.sent.append((recipient, body))
              return f"direct:{len(self.sent)}"
    notify/transports/${opt_2}.py: |
      """Queues messages and delivers them in order from an outbox."""
      from collections import deque


      class Transport:
          def __init__(self):
              self.outbox = deque()
              self.sent = []

          def send(self, recipient, body):
              self.outbox.append((recipient, body))
              while self.outbox:
                  self.sent.append(self.outbox.popleft())
              return f"queued:{len(self.sent)}"
    notify/dispatch.py: |
      """Formats notifications and hands them to a delivery transport."""


      def render(recipient, event):
          return f"Hi {recipient}, {event}."


      class Dispatcher:
          def __init__(self):
              self.transport = None

          def notify(self, recipient, event):
              if self.transport is None:
                  raise RuntimeError("no delivery transport configured")
              return self.transport.send(recipient, render(recipient, event))
    tests/__init__.py: ""
    tests/test_dispatch.py: |
      import unittest

      from notify import transports
      from notify.dispatch import Dispatcher, render


      class RenderTest(unittest.TestCase):
          def test_render(self):
              self.assertEqual(render("ana", "build passed"), "Hi ana, build passed.")


      class DispatcherTest(unittest.TestCase):
          def test_notify_returns_a_receipt(self):
              receipt = Dispatcher().notify("ana", "build passed")
              self.assertIsInstance(receipt, str)
              self.assertTrue(receipt)

          def test_transport_is_registered(self):
              dispatcher = Dispatcher()
              self.assertIsInstance(dispatcher.transport, tuple(transports.REGISTRY.values()))


      if __name__ == "__main__":
          unittest.main()

  # Rows 9, 10, 15 — as notify_transport, but the README names a fallback, so
  # "nothing is settled" has a right answer that memory must not override.
  notify_default:
    <<: *notify_files
    README.md: |
      # ${project}

      Outbound notification service. `notify.dispatch.Dispatcher` formats a
      message and hands it to a delivery transport.

      Transports live in `notify/transports/`; each exposes a `Transport` class
      with `send(recipient, body)` returning a receipt string, registered by name
      in `notify.transports.REGISTRY`. If the project has not settled on a
      transport, use `${default}`.

      Run the tests with `python3 -m unittest -q`.

  # Row 8 — one setting to fill in, whose value lives beside a corrected one.
  notify_deadletter:
    .gitignore: |
      __pycache__/
    README.md: |
      # ${project}

      Outbound notification service. Messages that cannot be delivered are
      routed by `notify.deadletter.route_failed` to the dead-letter queue named
      in `notify/config.py`.

      Run the tests with `python3 -m unittest -q`.
    notify/__init__.py: ""
    notify/config.py: |
      """Notifier settings."""

      # Name of the queue failed notifications are parked in.
      DEAD_LETTER_QUEUE = None
    notify/deadletter.py: |
      """Routing for notifications that could not be delivered."""
      from notify import config


      def route_failed(message):
          if config.DEAD_LETTER_QUEUE is None:
              raise RuntimeError("no dead-letter queue configured")
          return config.DEAD_LETTER_QUEUE, message
    tests/__init__.py: ""
    tests/test_deadletter.py: |
      import unittest

      from notify import config
      from notify.deadletter import route_failed


      class DeadLetterTest(unittest.TestCase):
          def test_queue_is_named(self):
              self.assertIsInstance(config.DEAD_LETTER_QUEUE, str)
              self.assertTrue(config.DEAD_LETTER_QUEUE)

          def test_failed_message_is_routed_to_the_queue(self):
              self.assertEqual(route_failed("hi"), (config.DEAD_LETTER_QUEUE, "hi"))


      if __name__ == "__main__":
          unittest.main()

  # Rows 5, 6 — a value agreed in an earlier session and never written down in the repo.
  ledger_migration:
    .gitignore: |
      __pycache__/
    README.md: |
      # ${project}

      Ledger migration tooling. `migrate.run.plan_batch(rows)` groups rows into
      the migration batch named by `migrate.config.BATCH_ID`, which the data
      team assigns.

      Run the tests with `python3 -m unittest -q`.
    migrate/__init__.py: ""
    migrate/config.py: |
      """Migration settings."""

      # Assigned by the data team; set before the first run.
      BATCH_ID = None
    migrate/run.py: |
      """Batch planning for the ledger migration."""
      from migrate import config


      def plan_batch(rows):
          if config.BATCH_ID is None:
              raise RuntimeError("BATCH_ID is not set")
          return {"batch": config.BATCH_ID, "rows": len(rows)}
    tests/__init__.py: ""
    tests/test_run.py: |
      import unittest

      from migrate import config
      from migrate.run import plan_batch


      class PlanBatchTest(unittest.TestCase):
          def test_batch_id_is_set(self):
              self.assertIsInstance(config.BATCH_ID, str)
              self.assertTrue(config.BATCH_ID)

          def test_plan_counts_rows(self):
              self.assertEqual(plan_batch([1, 2, 3])["rows"], 3)


      if __name__ == "__main__":
          unittest.main()

  # Row 7 — the answer is in the repo; memory knows only unrelated things.
  service_banner:
    .gitignore: |
      __pycache__/
    README.md: |
      # ${project}

      Small status service. `service.banner.build_banner(name)` produces the line
      printed at startup; deployment settings live in `service/config.py`.

      Run the tests with `python3 -m unittest -q`.
    service/__init__.py: ""
    service/config.py: |
      """Deployment settings for this build."""

      REGION = "north"
      PORT = 8080
      BUILD_TAG = "${repo_tag}"
    service/banner.py: |
      """Startup banner."""


      def build_banner(name):
          return f"{name} ready"
    tests/__init__.py: ""
    tests/test_banner.py: |
      import unittest

      from service import config
      from service.banner import build_banner


      class BannerTest(unittest.TestCase):
          def test_banner_names_the_service(self):
              self.assertTrue(build_banner("status").startswith("status"))

          def test_banner_carries_the_build_tag(self):
              self.assertIn(config.BUILD_TAG, build_banner("status"))


      if __name__ == "__main__":
          unittest.main()

scenarios:

  # ── Row 1 — rejected approach with rationale ─────────────────────────────
  - id: r01-pos
    row: 1
    control: positive
    repo: ingest_cache
    tokens: {keep: ident, reject: ident, incident: tag, filler_a: tag, filler_b: tag}
    options: [keep, reject]
    prompt: |
      Add caching to Pipeline.fetch in ingest/pipeline.py using one of the cache
      backends in ingest/backends, and follow the project's earlier decisions
      about backends. Make the tests pass (python3 -m unittest -q). In your final
      reply, say which backend you used and why.
    events:
      - {date: "${d24}", op: save, type: Insight, slug: "${project}-log-retention",
         title: Ingest log retention,
         body: "Ingest logs are kept for 14 days in the ${filler_a} bucket."}
      - {date: "${d21}", op: save, type: Insight, slug: "${project}-release-notes",
         title: Release announcements,
         body: "Release notes for the ingest service are posted to the ${filler_b} channel."}
      - {date: "${d17}", op: save, type: Decision, slug: "${project}-cache-backend",
         title: Ingest cache backend,
         body: "Use ${keep} as the cache backend for the ingest pipeline. ${reject} was tried first and rejected after incident ${incident}: it served stale records after a key was rewritten."}
    expect:
      diff_uses: [keep]
      diff_avoids: [reject]
      answer_cites: [incident]
      answer_avoids: [filler_a, filler_b]
    # P0: Codex restated the reason without the incident id and was failed.
    # Citing the reason in words counts; both stems must appear.
    rationale_words: [stale, rewrit]
    acted: [diff_uses]
    irrelevant: [filler_a, filler_b]
    key: [incident]
    needs_memory: true

  - id: r01-neg
    row: 1
    control: negative
    repo: ingest_cache
    tokens: {keep: ident, reject: ident, filler_a: tag, filler_b: tag}
    options: [keep, reject]
    prompt: |
      Add caching to Pipeline.fetch in ingest/pipeline.py using one of the cache
      backends in ingest/backends, and follow the project's earlier decisions
      about backends. Make the tests pass (python3 -m unittest -q). In your final
      reply, say which backend you used and why.
    events:
      - {date: "${d24}", op: save, type: Insight, slug: "${project}-log-retention",
         title: Ingest log retention,
         body: "Ingest logs are kept for 14 days in the ${filler_a} bucket."}
      - {date: "${d21}", op: save, type: Insight, slug: "${project}-release-notes",
         title: Release announcements,
         body: "Release notes for the ingest service are posted to the ${filler_b} channel."}
      - {date: "${d17}", op: save, type: Insight, slug: "${project}-loader-owner",
         title: Loader ownership,
         body: "The record loader is owned by the data team; schema changes go through them first, and loader timeouts are set by them."}
    expect:
      diff_uses_any: [keep, reject]
      answer_avoids: [filler_a, filler_b]
    acted: [diff_uses_any]
    irrelevant: [filler_a, filler_b]
    needs_memory: false

  # ── Row 2 — explicit A → B decision change ───────────────────────────────
  - id: r02-pos
    row: 2
    control: positive
    repo: notify_transport
    tokens: {old: ident, new: ident, decision_ref: tag, change_ref: tag, filler_a: tag, filler_b: tag}
    options: [old, new]
    prompt: &notify_prompt |
      Dispatcher.notify in notify/dispatch.py has no delivery transport yet, so
      it raises. Wire up the transport this project has settled on from
      notify/transports and make the tests pass (python3 -m unittest -q). In your
      final reply, name the transport you used.
    events:
      - {date: "${d26}", op: save, type: Insight, slug: "${project}-templates",
         title: Notification templates,
         body: "Notification wording is reviewed by the ${filler_a} group before release."}
      - {date: "${d23}", op: save, type: Insight, slug: "${project}-rate-limit",
         title: Notification rate limit,
         body: "Each recipient gets at most 20 notifications per hour, tracked under ${filler_b}."}
      - {date: "${d20}", op: save, type: Decision, slug: "${project}-transport",
         title: Notifier transport,
         body: "Send outbound notifications through the ${old} transport (agreed in review ${decision_ref})."}
      - {date: "${d7}", op: correct, target_slug: "${project}-transport",
         new_text: "Send outbound notifications through the ${new} transport (changed in review ${change_ref}); ${old} is no longer used.",
         reason: "${old} dropped messages under load."}
    expect:
      diff_uses: [new]
      diff_avoids: [old]
      answer_uses: [new]
      answer_avoids: [filler_a, filler_b]
    acted: [diff_uses]
    irrelevant: [filler_a, filler_b]
    key: [change_ref]
    needs_memory: true

  - id: r02-neg
    row: 2
    control: negative
    repo: notify_transport
    tokens: {old: ident, new: ident, decision_ref: tag, filler_a: tag, filler_b: tag}
    options: [old, new]
    prompt: |
      Dispatcher.notify in notify/dispatch.py has no delivery transport yet, so
      it raises. Wire up the transport this project has settled on from
      notify/transports and make the tests pass (python3 -m unittest -q). In your
      final reply, name the transport you used.
    events:
      - {date: "${d26}", op: save, type: Insight, slug: "${project}-templates",
         title: Notification templates,
         body: "Notification wording is reviewed by the ${filler_a} group before release."}
      - {date: "${d23}", op: save, type: Insight, slug: "${project}-rate-limit",
         title: Notification rate limit,
         body: "Each recipient gets at most 20 notifications per hour, tracked under ${filler_b}."}
      - {date: "${d20}", op: save, type: Decision, slug: "${project}-transport",
         title: Notifier transport,
         body: "Send outbound notifications through the ${old} transport (agreed in review ${decision_ref})."}
    expect:
      diff_uses: [old]
      diff_avoids: [new]
      answer_uses: [old]
      answer_avoids: [filler_a, filler_b]
    acted: [diff_uses]
    irrelevant: [filler_a, filler_b]
    key: [decision_ref]
    needs_memory: true

  # ── Row 7 — irrelevant memory; the answer is in the repo ─────────────────
  - id: r07-ctl
    row: 7
    control: control
    repo: service_banner
    tokens: {repo_tag: tag, fact_a: tag, fact_b: tag, fact_c: tag}
    prompt: &banner_prompt |
      The startup banner from service.banner.build_banner should include this
      build's tag so operators can tell deployments apart. Make that change and
      keep the tests passing (python3 -m unittest -q). In your final reply,
      quote the build tag.
    events:
      - {date: "${d25}", op: save, type: Insight, slug: "${project}-oncall",
         title: On-call rotation,
         body: "The status service on-call rotation is tracked in the ${fact_a} schedule."}
      - {date: "${d22}", op: save, type: Insight, slug: "${project}-staging-snapshots",
         title: Staging snapshots,
         body: "Staging database snapshots for the status service are named ${fact_b}."}
      - {date: "${d16}", op: save, type: Decision, slug: "${project}-load-tests",
         title: Load test fixtures,
         body: "Load tests for the status service run against the ${fact_c} fixture set."}
    expect:
      answer_uses: [repo_tag]
      answer_avoids: [fact_a, fact_b, fact_c]
      diff_avoids: [fact_a, fact_b, fact_c]
    acted: [answer_uses]
    irrelevant: [fact_a, fact_b, fact_c]
    needs_memory: false

  # ═══ v2: rows 3–17 ════════════════════════════════════════════════════════
  #
  # Shared filler events (true, unrelated, stamped) so every arm has something
  # beside the point to inject. Anchored once, reused by alias.

  # ── Row 3 — A→B still holds after a restart and a second consolidation ───
  - id: r03-pos
    row: 3
    control: positive
    repo: notify_transport
    tokens: {old: ident, new: ident, decision_ref: tag, change_ref: tag, filler_a: tag}
    options: [old, new]
    prompt: *notify_prompt
    events:
      - &fill_notify {date: "${d26}", op: save, type: Insight, slug: "${project}-templates",
         title: Notification templates,
         body: "Notification wording is reviewed by the ${filler_a} group before release."}
      - &decide_old {date: "${d20}", op: save, type: Decision, slug: "${project}-transport",
         title: Notifier transport,
         body: "Send outbound notifications through the ${old} transport (agreed in review ${decision_ref})."}
      # The status document consolidation compacts into. Saved through /save
      # as a ProjectSnapshot (→ projects/<project>-status.md) with authored
      # fact markers, because consolidation only compacts into an existing,
      # fact-marked document. Not a line in the file arm's log: it restates
      # the decision above. Standard dated bullets, as a user or session-end
      # writes them; being as_of-relative they sit inside the store's
      # status-log retention window, so none is retired by age alone.
      - &status_doc {date: "${d20}", op: save, type: ProjectSnapshot, slug: "${project}-status",
         title: "${project} status", raw_body: true, silent_in_log: true,
         body: "- [${d26}] Notification wording is reviewed by the ${filler_a} group. <!-- fact:${project}-templates -->\n- [${d20}] Notifier transport: ${old} (agreed in review ${decision_ref}). <!-- fact:${project}-transport -->"}
      - &correct_new {date: "${d7}", op: correct, target_slug: "${project}-transport",
         new_text: "Send outbound notifications through the ${new} transport (changed in review ${change_ref}); ${old} is no longer used.",
         reason: "${old} dropped messages under load."}
      # Session notes are consolidation's input (daily/). Each names
      # project/<slug> in its text: the daily entry has no other project ref.
      # A note is written at as_of, so it refers back to the ${d7} switch
      # rather than announcing it: announcing it "today" contradicted the
      # correction's date and the pass proposed a contradiction (rig run).
      - {date: "${d0}", op: session_end,
         summary: "Session on project/${project}: the notifier transport was switched from ${old} to ${new} on ${d7} (review ${change_ref}); ${old} dropped messages under load.",
         decisions: ["Notifier transport has been ${new}, not ${old}, since ${d7} (review ${change_ref})."]}
      - {op: consolidate}
      - {op: restart, units: [api, mcp]}
      # A second note after the restart, so the second pass has new input
      # (a pass with nothing new since the project's watermark does nothing).
      - {date: "${d0}", op: session_end,
         summary: "Session on project/${project}: after the restart the notifier still runs on ${new}, as it has since ${d7}; no further change.",
         decisions: ["Notifier transport stays ${new}."]}
      - {op: consolidate}
    expect:
      diff_uses: [new]
      diff_avoids: [old]
      answer_uses: [new]
      answer_avoids: [filler_a]
    acted: [diff_uses]
    irrelevant: [filler_a]
    key: [change_ref]
    needs_memory: true
    metrics:
      valid_correction_use: {diff_has: [new], diff_lacks: [old]}
      old_decision_reuse: {diff_has: [old]}
      presents_old_as_current: {answer_has: [old], answer_lacks: [new]}
      ignored_explicit_correction: {diff_has: [old], when_delivered: [change_ref]}

  # ── Row 4 — a correction captured from a transcript ──────────────────────
  - id: r04-pos
    row: 4
    control: positive
    repo: notify_transport
    tokens: {old: ident, new: ident, decision_ref: tag, change_ref: tag, filler_a: tag}
    options: [old, new]
    prompt: *notify_prompt
    transcripts:
      chat:
        - {role: user, text: "Scratch that — for the notifier, use ${new} instead of ${old}. ${old} dropped messages under load (review ${change_ref})."}
        - {role: assistant, text: "Understood."}
    events:
      - *fill_notify
      - *decide_old
      - *status_doc
      - {date: "${d7}", op: transcript_capture, transcript: chat, confirm: true,
         log: "Notifier transport (changed in chat): use ${new} instead of ${old}; ${old} dropped messages under load (review ${change_ref})."}
      - {date: "${d0}", op: session_end,
         summary: "Session on project/${project}: in chat the user switched the notifier to ${new} instead of ${old} (review ${change_ref}).",
         decisions: ["Notifier transport: use ${new} instead of ${old} (review ${change_ref})."]}
      - {op: consolidate}
    expect:
      diff_uses: [new]
      diff_avoids: [old]
      answer_uses: [new]
      answer_avoids: [filler_a]
    acted: [diff_uses]
    irrelevant: [filler_a]
    key: [change_ref]
    needs_memory: true
    metrics:
      valid_correction_use: {diff_has: [new], diff_lacks: [old]}
      old_decision_reuse: {diff_has: [old]}
      ignored_explicit_correction: {diff_has: [old], when_delivered: [change_ref]}

