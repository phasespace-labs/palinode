      Following yesterday's write-up: dual-write replication is rejected for
      Harborlight. Reconciliation cost is the reason — a partial failure leaves
      the primary and the replica disagreeing and the repair job is bigger than
      the problem. Split-brain under partition was the second reason.

  # ── harborlight: long records whose auto-footer is its own chunk ────────

  - id: hl-onboarding-guide
    project: harborlight
    category: projects
    type: ProjectSnapshot
    role: noise
    date: "2026-04-30"
    entities:
      - project/harborlight-release-4-2-0
      - person/nadia-okonkwo
    title: Harborlight laptop onboarding guide
    sections:
      - heading: Accounts
        text: |
          A new engineer needs four accounts before anything else works: the
          source host, the artifact store, the paging tool and the dashboard.
          Ask Marta Delacroix; she has the template request and will file all
          four at once. Expect a day for the paging tool, which is the slow one
          because it needs a phone number verified out of band and the vendor
          batches those overnight. Nothing in this section is worth reading
          twice; it exists so that nobody has to reconstruct the list.
      - heading: Local setup
        text: |
          Clone the tree, create a virtual environment, install the development
          extras, run the test suite once before changing anything. If the suite
          fails on a clean tree the usual cause is a stale artifact cache; clear
          it and run again. The editor configuration is checked in and should be
          left alone. There is a pre-commit hook that formats and lints; install
          it, because the continuous integration job runs the same checks and
          finding out there is slower than finding out here.
      - heading: First task
        text: |
          Every new engineer takes the same first task: fix one open papercut of
          their choosing, end to end, including the test. The point is not the
          papercut. The point is to walk the whole path once — branch, change,
          test, review, merge, deploy — while somebody is paying attention and
          can answer a question without it costing anybody anything. Pick
          something small enough to finish in two days.
      - heading: Who to ask
        text: |
          Sync planner questions go to Rafael Ibarra. Deployment and rollout
          questions go to Sunil Achterberg. Anything about the pager goes to
          Marta Delacroix. If the question is "should we", it goes to Nadia
          Okonkwo, and if the answer matters it should end up written down
          somewhere better than a chat thread, because an onboarding guide is
          where facts come to be six months out of date.
      - heading: Things this guide does not answer
        text: |
          This guide will not tell you what is running in production, what the
          supported version window is, what the retention period is, or which
          schema version the envelope uses. Every one of those has moved at
          least once since this guide was written and each has its own record.
          If you find yourself reading an onboarding guide for an answer of
          that shape, the guide is the wrong document and the links at the foot
          of this note are not an endorsement of it as a source. Ask the person
          named above instead, or read the decision record directly, and if
          neither exists then the honest answer is that nobody has written it
          down and somebody should before the next person has to ask.

  - id: hl-weekly-notes
    project: harborlight
    category: projects
    type: ProjectSnapshot
    role: noise
    date: "2026-06-30"
    entities:
      - decision/harborlight-retention-policy
      - person/rafael-ibarra
    title: Harborlight weekly sync notes, late June
    sections:
      - heading: Round the table
        text: |
          Rafael Ibarra is still on the replay cursor and expects to be for
          another week. Sunil Achterberg finished the ring-three automation and
          has moved to the rollout dashboard, which nobody asked for but
          everybody will use. Marta Delacroix spent most of the week on the
          pager and has asked, again, whether the secondary can be staffed. No
          decision. Nadia Okonkwo was out.
      - heading: Chores
        text: |
          The artifact store is at eighty percent and needs a prune policy that
          somebody owns. The flaky test in the planner suite has failed four
          times this month and has not been looked at. Two dashboards point at a
          metric that was renamed in April and have been showing a flat line
          ever since, which is worse than showing nothing. None of these are
          urgent and all of them will still be here in September.
      - heading: Carried over
        text: |
          Three items have been carried from the previous two weeks without
          movement. The prune policy for the artifact store still has no owner
          and the store will be full before anybody assigns one. The flaky
          planner test is still flaky and still unassigned. The two dead
          dashboards are still dead. The pattern here is that chores with no
          named owner survive indefinitely in a weekly note, which is a thing
          worth noticing about weekly notes in general rather than about these
          three chores in particular. Sunil Achterberg offered to take the prune
          policy if nobody else wanted it, which counts as an owner right up
          until the moment it needs doing.
      - heading: Next week
        text: |
          Replay cursor review, rollout dashboard demo, and a decision on
          whether the secondary pager slot gets staffed. Marta Delacroix will
          bring numbers on how often the primary was paged outside hours, which
          is the only part of this that will change anyone's mind. Notes taken
          by Sunil Achterberg. Nothing in these notes decides anything about
          retention, schema versions or the region topology, whatever the links
          at the bottom of this note might suggest.

  # ── tidewater: the unrelated second project ─────────────────────────────

  - id: td-release-2-1-0
    project: tidewater
    category: projects
    type: ProjectSnapshot
    role: cross_project
    date: "2026-05-19"
    title: Tidewater 2.1.0 is the current release
    body: |
      Tidewater 2.1.0 was cut on 19 May 2026 and is the current release. The tag
      is TW-2.1.0 and it is the build running in production. Sunil Achterberg
      signed the cut. Tidewater is the billing service and shares no code with
      the sync services.

  - id: td-rejected-dual-write
    project: tidewater
    category: decisions
    type: Decision
    role: cross_project
    date: "2026-03-18"
    title: Tidewater rejected dual-write replication
    body: |
      Dual-write replication was considered for Tidewater and rejected. The
      billing ledger cannot tolerate two stores disagreeing even briefly, and
      dual-write makes that state reachable on any partial failure.
      Reconciliation cost was the second reason. Tidewater replicates from the
      ledger's own change feed instead.

  - id: td-retention-decision
    project: tidewater
    category: decisions
    type: Decision
    role: cross_project
    date: "2026-06-21"
    title: Tidewater retains ledger history for 7 years
    body: |
      Tidewater retains ledger history for 7 years. This is a regulatory floor
      rather than an engineering choice and is not negotiable against storage
      cost. It has no relationship to the retention window of any other service.

  - id: td-batch-window
    project: tidewater
    category: decisions
    type: Decision
    role: cross_project
    date: "2026-06-14"
    title: Tidewater default settlement window is 400 ms
    body: |
      The default value of settle.batch_window_ms in Tidewater is 400. It was
      chosen so a settlement batch closes inside the payment processor's
      acknowledgement timeout. Tidewater has no sync.batch_window_ms setting;
      the name belongs to a different service.

  - id: td-quarterly-review
    project: tidewater
    category: projects
    type: ProjectSnapshot
    role: cross_project
    date: "2026-07-02"
    entities:
      - project/harborlight-release-4-2-0
      - person/marta-delacroix
    title: Tidewater quarterly review
    sections:
      - heading: Where the quarter landed
        text: |
          Tidewater closed the quarter on 2.1.0 with the settlement rewrite
          finished and the ledger export still open. The rewrite is the headline:
          settlement batches now close inside the processor timeout without the
          retry loop that used to hide the problem. The export slipped because
          the schema it exports to changed under us twice and the second change
          arrived without notice.
      - heading: Cost
        text: |
          Billing infrastructure cost fell eleven percent, almost all of it the
          retry loop going away. The remaining line that matters is ledger
          storage, which is fixed by regulation and will not move. Marta
          Delacroix asked whether the export could reuse another team's pipeline
          rather than building a third one; nobody had an answer and it is worth
          asking again before the export restarts.
      - heading: What did not happen
        text: |
          The ledger export did not ship and will not ship this quarter. The
          processor-specific code path that everybody agreed to delete in April
          is still there, because deleting it requires a migration nobody has
          scheduled. The shared on-call conversation was deferred for the second
          time. None of these are surprises and all three were predicted in the
          previous quarterly review, which suggests the review is better at
          forecasting slippage than at preventing it.
      - heading: Next quarter
        text: |
          Finish the ledger export, retire the last processor-specific code path
          and decide whether Tidewater keeps its own on-call rotation or folds
          into the shared one. That last one is a people question rather than a
          technical one and has been deferred twice. Notes by Marta Delacroix.
          Nothing in this review says anything about any other service; where a
          link at the foot of this note points somewhere else, it points at a
          person or a release that came up in conversation, not at a fact this
          review establishes or a decision this team took. Tidewater's numbers
          are Tidewater's; read them as nothing else.

  - id: td-incident-note
    project: tidewater
    category: insights
    type: Insight
    role: cross_project
    date: "2026-08-11"
    title: Tidewater settlement stall, August
    body: |
      Tidewater stalled settlement for forty minutes on 11 August when the
      processor returned a novel error code the retry path did not recognise and
      the batch stayed open. Fixed by widening the retriable set. The stall was
      contained to Tidewater and touched no other service.
