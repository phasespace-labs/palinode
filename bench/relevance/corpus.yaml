  - id: hl-release-4-0-0-old
    project: harborlight
    category: projects
    type: ProjectSnapshot
    role: old_context
    date: "2026-01-22"
    title: Harborlight 4.0.0 is the current release
    body: |
      Harborlight 4.0.0 was cut on 22 January 2026 and is the current release.
      The tag is HL-4.0.0. This is the first release on the new sync planner and
      it deploys all at once rather than in rings. Nadia Okonkwo signed the cut.

  - id: hl-batch-window-old
    project: harborlight
    category: decisions
    type: Decision
    role: old_context
    date: "2026-02-12"
    title: Harborlight default sync batch window is 250 ms
    body: |
      The default value of sync.batch_window_ms in Harborlight is 250. A shorter
      window was chosen so that a single slow shard cannot hold a batch open.
      Operators who want fewer, larger batches may raise sync.batch_window_ms
      per environment; 250 is what a fresh install gets.

  - id: hl-planning-notes-q1
    project: harborlight
    category: projects
    type: ProjectSnapshot
    role: noise
    date: "2026-01-09"
    entities:
      - project/harborlight
      - person/nadia-okonkwo
    title: Harborlight first-quarter planning notes
    sections:
      - heading: Scope
        text: |
          The quarter has four themes: sync throughput, replay ergonomics, the
          deployment story, and whatever the audit turns up. None of these are
          decided yet; this note exists so the conversation has somewhere to
          land. Throughput is the one with a number attached, because the sync
          planner has never been measured under a shard count above forty and
          the next three onboardings all clear that. Replay ergonomics is the
          one everybody wants and nobody has written down. The deployment story
          is contested between the people who ship weekly and the people who
          answer the pager.
      - heading: Open questions
        text: |
          Does the planner need a queue at all, or is the batch window enough?
          Should replay be a separate binary? Is there a version of the rollout
          that does not require an operator to watch a dashboard for two hours?
          What does support actually need from a release note? Each of these has
          at least two people with strong opinions and no owner, which is the
          normal state of a planning note in January and the reason this record
          should not be read as a decision about anything.
      - heading: Not decided here
        text: |
          Nothing in this note settles retention, authentication lifetimes,
          schema versioning, region topology, the batch window default, or the
          release cadence. Those all have their own records, written later, and
          where this note disagrees with one of them the other record wins. This
          paragraph exists because planning notes get retrieved for queries they
          cannot answer, and a reader who lands here should be told so rather
          than left to infer it from the date.
      - heading: Attendees
        text: |
          Nadia Okonkwo, Rafael Ibarra, Sunil Achterberg and Marta Delacroix
          attended. Notes taken by Rafael Ibarra. The next planning session is
          unscheduled; whoever books it should bring the throughput numbers,
          because without them the throughput theme is a slogan rather than a
          plan and the quarter will end with the same four themes restated.
          Marta Delacroix asked that the pager load be on the agenda whenever
          the session does get booked, on the grounds that it is the only theme
          with a person attached to it rather than a system, and that it has
          been carried forward from the previous two quarters without anybody
          disagreeing with it or doing anything about it either.

  # ── harborlight: rejected approaches, with the reason ───────────────────

  - id: hl-rejected-dual-write
    project: harborlight
    category: decisions
    type: Decision
    role: rejected
    date: "2026-03-12"
    dup_group: rejected-dual-write
    title: Harborlight rejected dual-write replication
    body: |
      Dual-write replication was considered for Harborlight and rejected. Under
      dual-write the service writes each record to both the primary store and
      the replica in the same request. It was rejected because reconciliation
      cost dominates: any partial failure leaves the two stores disagreeing, and
      the repair job we would have to write is larger than the replication
      problem it solves. Split-brain during a network partition was the second
      reason. Rafael Ibarra wrote the rejection up.

  - id: hl-rejected-cron-poller
    project: harborlight
    category: decisions
    type: Decision
    role: rejected
    date: "2026-03-26"
    title: Harborlight rejected a cron-driven poller
    body: |
      A cron-driven poller was proposed as the Harborlight sync trigger and
      rejected. The design polls each source on a fixed schedule and enqueues
      whatever changed. It was rejected because the schedule sets a hard latency
      floor of sixty seconds, and three of the committed integrations need sync
      to complete inside ten. Polling also wastes a full scan per interval on
      sources that did not change.

  - id: hl-rejected-vendor-queue
    project: harborlight
    category: decisions
    type: Decision
    role: rejected
    date: "2026-04-09"
    title: Harborlight rejected a managed queue vendor
    body: |
      Moving the Harborlight work queue to a managed vendor was evaluated and
      rejected. The functionality was adequate. It was rejected on cost: the
      vendor bills cross-region egress per message, and the region topology
      means most messages cross a region boundary, so the projected monthly bill
      was roughly four times the self-hosted queue it would replace. Revisit if
      the topology changes.

  - id: hl-rejected-inline-compression
    project: harborlight
    category: decisions
    type: Decision
    role: rejected
    date: "2026-04-23"
    title: Harborlight rejected inline payload compression
    body: |
      Compressing sync payloads inline on the write path was tried and rejected.
      It halved transfer bytes as expected. It was rejected because the CPU cost
      lands on the write path, where the budget is tightest: at the measured
      shard counts compression added enough per-record latency to push the batch
      window past its target. Compression at rest, off the write path, is still
      open.

  - id: hl-rejected-client-dedup
    project: harborlight
    category: decisions
    type: Decision
    role: rejected
    date: "2026-05-07"
    title: Harborlight rejected client-side deduplication
    body: |
      Client-side deduplication was rejected for Harborlight. The proposal had
      each client suppress records it believed it had already sent, keyed on a
      local timestamp. It was rejected on correctness: under clock skew between
      clients the key is not unique, and two clients with drifting clocks can
      suppress different records while both believing they deduplicated
      correctly. Deduplication stays server-side.

  # ── harborlight: changed decisions, old and new, plus the recency trap ──

  - id: hl-retention-old
    project: harborlight
    category: decisions
    type: Decision
    role: superseded
    date: "2026-02-03"
    title: Harborlight retains sync history for 30 days
    body: |
      Harborlight retains sync history for 30 days. The window was chosen to
      cover a monthly reconciliation cycle with a few days of slack. Filed as
      RFC-HARBOR-0088. Storage cost was the binding constraint; nobody asked for
      longer at the time.

  - id: hl-retention-new
    project: harborlight
    category: decisions
    type: Decision
    role: current_decision
    date: "2026-06-18"
    title: Harborlight retains sync history for 90 days
    body: |
      Harborlight retains sync history for 90 days. This replaces the earlier
      30-day window. Filed as RFC-HARBOR-0142. Two customer investigations in
      the spring needed history older than 30 days and could not get it, which
      is what moved the number. Storage cost roughly tripled and was accepted.
      This is the retention period in force.

  - id: hl-retention-proposal
    project: harborlight
    category: insights
    type: Insight
    role: proposal
    date: "2026-08-22"
    epistemic: open_question
    title: Proposal to cut Harborlight retention to 14 days
    body: |
      There is a proposal to cut Harborlight sync history retention to 14 days.
      The argument is that the 90-day window is used by almost nobody and that
      the storage line is now the largest single cost in the service. No
      decision has been taken. The proposal has not been reviewed, has no filed
      number, and nothing has changed in production. Read this as an open
      question, not as the retention period.

  - id: hl-auth-ttl-old
    project: harborlight
    category: decisions
    type: Decision
    role: superseded
    date: "2026-01-15"
    title: Harborlight access tokens live for 24 hours
    body: |
      Harborlight access tokens are issued with a 24-hour time to live. The long
      lifetime keeps batch integrations from re-authenticating mid-run, which
      was the complaint that drove the number. Refresh is manual.

  - id: hl-auth-ttl-new
    project: harborlight
    category: decisions
    type: Decision
    role: current_decision
    date: "2026-04-02"
    title: Harborlight access tokens live for 1 hour
    body: |
      Harborlight access tokens are issued with a 1-hour time to live, replacing
      the earlier 24-hour lifetime. Automatic refresh landed with the same
      change, so batch integrations no longer break at the boundary. The shorter
      lifetime is what the service issues today.

  - id: hl-auth-incident-note
    project: harborlight
    category: insights
    type: Insight
    role: old_context
    date: "2026-07-30"
    title: Retro on the long-lived token incident
    body: |
      Writing up the token incident for the record. At the time of the incident
      Harborlight access tokens lived for 24 hours, and a token leaked from a
      build log stayed usable for most of a day before anyone noticed. The
      24-hour lifetime is the fact that made the blast radius what it was. This
      note describes the state during the incident and is not a statement about
      what the service issues now.

  - id: hl-schema-v2-old
    project: harborlight
    category: decisions
    type: Decision
    role: superseded
    date: "2026-03-01"
    title: Harborlight production runs schema version 2
    body: |
      Harborlight production runs schema_version=2. Version 2 splits the record
      envelope from the payload so the envelope can be validated without
      decoding the body. Every ring is on it.

  - id: hl-schema-v3-new
    project: harborlight
    category: decisions
    type: Decision
    role: current_decision
    date: "2026-05-20"
    title: Harborlight production runs schema version 3
    body: |
      Harborlight production runs schema_version=3, replacing version 2. Version
      3 adds the cursor field the replay endpoint needs and makes the envelope
      checksum mandatory. The migration ran ring by ring and completed with the
      4.2.0 rollout. Production is on version 3.

  - id: hl-schema-staging-rollback
    project: harborlight
    category: insights
    type: Insight
    role: scoped_note
    date: "2026-09-01"
    title: Staging rolled back to schema version 2
    body: |
      Staging was rolled back to schema_version=2 this week while we reproduce a
      replay fault. This is a staging-only change with no production component;
      production remains on version 3. The rollback will be undone once the
      fault is reproduced. Do not read this note as a change to the production
      schema version.

  - id: hl-region-single-old
    project: harborlight
    category: decisions
    type: Decision
    role: superseded
    date: "2026-02-20"
    title: Harborlight runs in a single region
    body: |
      Harborlight runs in one region. A second region was costed and judged not
      worth it at the current customer footprint: the failure modes we have seen
      are process-level, not regional, and a second region adds a replication
      problem we do not have today.

  - id: hl-region-two-new
    project: harborlight
    category: decisions
    type: Decision
    role: current_decision
    date: "2026-07-05"
    title: Harborlight runs two regions, active-passive
    body: |
      Harborlight now runs two regions in an active-passive topology, replacing
      the single-region arrangement. Filed as ADR-HARBOR-0031. The passive
      region carries a warm replica and takes traffic only on an explicit
      failover. Two committed customers required a regional failover story,
      which is what moved this. This is the topology in force.

  - id: hl-region-cost-memo
    project: harborlight
    category: insights
    type: Insight
    role: proposal
    date: "2026-08-30"
    epistemic: open_question
    title: Memo revisiting the cost of the passive region
    body: |
      A memo circulated this week arguing that the passive Harborlight region
      costs more than the failover story is worth, and that collapsing back to a
      single region would pay for two engineers. It is a memo. Nothing has been
      decided, no review has happened, and the active-passive topology is still
      what runs. Recorded so the argument is not relitigated from memory.

