# Relevance / abstention fixture corpus — SYNTHETIC.
#
# Every project, person, host, version and identifier below is invented for
# this benchmark. Nothing here is copied from, derived from, or shaped after a
# real memory store. This directory ships publicly; keep it that way.
#
# Roles (see bench/relevance/corpus.py for the enforced vocabulary):
#   current_state     an answer about the release state as it stands now
#   current_decision  the decision in force after a change
#   superseded        the decision that was in force before the change
#   proposal          a newer, undecided proposal (the recency trap)
#   scoped_note       a newer note true only in a narrower scope (recency trap)
#   rejected          an approach that was considered and turned down, with why
#   old_context       an older note that is still true about the past
#   duplicate         a near-duplicate restatement of another record
#   noise             topically broad material with no answer in it
#   cross_project     a record belonging to the unrelated second project
#
# `sections:` makes a record long enough (>2000 chars of body) that the parser
# splits it on H2 headings — which is what gives the auto-footer its own chunk
# and makes footer-only hits reachable at all.

corpus_version: 1

projects:
  harborlight: The project under evaluation.
  tidewater: A second, unrelated project. Present only to test isolation.
  marlinworks: Named by no-answer questions. Deliberately has zero records.

people:
  - Nadia Okonkwo
  - Rafael Ibarra
  - Sunil Achterberg
  - Marta Delacroix

records:

  # ── harborlight: current release state ──────────────────────────────────

  - id: hl-release-4-2-0
    project: harborlight
    category: projects
    type: ProjectSnapshot
    role: current_state
    date: "2026-05-14"
    dup_group: release-4-2-0
    title: Harborlight 4.2.0 is the current release
    body: |
      Harborlight 4.2.0 was cut on 14 May 2026 and is the current release. The
      tag is HL-4.2.0 and it is the build running in every production ring.
      Nadia Okonkwo signed the cut. No 4.3 branch exists yet; the next minor is
      not scheduled. Treat HL-4.2.0 as the answer to "what is running" until a
      newer snapshot replaces this one.

  - id: hl-release-notes-4-2-0
    project: harborlight
    category: projects
    type: ProjectSnapshot
    role: current_state
    date: "2026-05-14"
    title: What shipped in Harborlight 4.2.0
    body: |
      Harborlight 4.2.0 ships three things. The sync planner now emits a single
      batch per window instead of one per shard. The replay endpoint accepts a
      cursor so an operator can resume an interrupted backfill. And the long
      standing checksum mismatch filed as HL-E0447 is fixed: the reader was
      hashing the decoded payload while the writer hashed the encoded one.
      Rafael Ibarra wrote the release notes.

  - id: hl-support-window
    project: harborlight
    category: decisions
    type: Decision
    role: current_state
    date: "2026-05-20"
    title: Harborlight supported version window
    body: |
      Harborlight supports the current minor and the one before it. As of the
      4.2.0 cut that means 4.2.x and 4.1.x receive fixes. Harborlight 4.0.x is
      out of support and receives nothing, not even security fixes. Anything in
      the 3.x line has been unsupported since the 4.0 cut. Operators asking
      whether 4.0 is still supported should read this as a no.

  - id: hl-deploy-target
    project: harborlight
    category: decisions
    type: Decision
    role: current_state
    date: "2026-06-02"
    title: Harborlight deploys through three staged rings
    body: |
      Harborlight deploys to production as a staged rollout across three rings.
      Ring one is internal traffic only, ring two is a five percent customer
      slice, ring three is everyone. A ring must hold for two hours with no
      budget burn before the next opens. This replaced the all-at-once deploy
      that the 4.0 line used. Sunil Achterberg owns the rollout tooling.

  - id: hl-batch-window-current
    project: harborlight
    category: decisions
    type: Decision
    role: current_state
    date: "2026-06-11"
    title: Harborlight default sync batch window is 750 ms
    body: |
      The default value of sync.batch_window_ms in Harborlight is 750. It was
      raised from the previous default after the ring-two rollout showed that a
      shorter window produced more partial batches than it saved in latency.
      Deployments that need tighter latency may override sync.batch_window_ms
      per environment, but 750 is what a fresh install gets today.

  - id: hl-error-budget-current
    project: harborlight
    category: decisions
    type: Decision
    role: current_state
    date: "2026-06-25"
    title: Harborlight error budget is 0.2 percent monthly
    body: |
      Harborlight runs against a monthly error budget of 0.2 percent of sync
      operations. Burning half the budget freezes ring three. Burning all of it
      freezes every ring until the following month. Marta Delacroix reviews the
      burn at the weekly sync. The budget is measured on completed operations,
      not on requests, so a retried operation counts once.

  - id: hl-runtime-baseline
    project: harborlight
    category: decisions
    type: Decision
    role: current_state
    date: "2026-07-08"
    title: Harborlight runtime baseline is Python 3.12
    body: |
      The supported runtime baseline for Harborlight is Python 3.12. Nothing in
      the tree may use syntax or standard library behaviour newer than that, and
      the test matrix no longer builds 3.11. The baseline moved when the sync
      planner adopted the newer task group semantics. A deployment still pinned
      to 3.11 will start but is unsupported.

  - id: hl-oncall-rotation
    project: harborlight
    category: projects
    type: ProjectSnapshot
    role: current_state
    date: "2026-07-16"
    title: Harborlight on-call rotation owner
    body: |
      Marta Delacroix owns the Harborlight on-call rotation. She took it over
      from Sunil Achterberg when the region work started. The rotation is two
      people deep with a one-week handover and no secondary outside business
      hours. Escalation past the rotation goes to Nadia Okonkwo.

