# Relevance / abstention question set — SYNTHETIC, versioned.
#
# Four classes, matching the four the workstream names:
#   release_state     what is the current release state
#   rejected_approach what was turned down, and why
#   changed_decision  a decision that changed; old versus new, where recency
#                     alone must not settle it
#   no_answer         nothing in the corpus answers this, including questions
#                     about a project with no records at all
#
# Variants:
#   base        the authored question
#   paraphrase  a held-out rewording of a base question, sharing few content
#               words with the record that answers it
#   identifier  an exact-identifier query (tag, config key, filed number)
#
# Fields:
#   relevant        record ids that answer the question. Empty = must abstain.
#   tolerated       record ids that are on-topic support rather than the answer.
#                   Not counted as an irrelevant injection, not counted as a hit.
#   must_not_be_top record ids that must not be ranked first. Retired values and
#                   newer-but-undecided material: the recency trap.

question_set_version: 1

questions:

  # ── release_state ───────────────────────────────────────────────────────

